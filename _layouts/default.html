<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#14213D">
  {% seo %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.nav -%}
        {%- if page.url == item.url -%}
          <a href="{{ item.url | relative_url }}" class="active" aria-current="page">{{ item.title }}</a>
        {%- else -%}
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {%- endif -%}
      {%- endfor -%}
    </nav>
  </header>

  <main id="main" class="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }} &middot; Last updated {{ site.time | date: "%B %Y" }}</p>
  </footer>
</body>
</html>
